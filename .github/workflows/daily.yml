name: 每日更新看板娘

on:
  schedule:
    # UTC 16:00 = 北京时间 0:00（每天）
    # 注意：GitHub Actions 的 schedule 使用 UTC 时间
    - cron: '0 16 * * *'
  workflow_dispatch:        # 允许在 Actions 页面手动触发（用于测试）

permissions:
  contents: write           # 授予机器人修改仓库的权限

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行更新脚本
        run: python update.py

      - name: 提交并推送更改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          # 如果没有变更则跳过提交（API 失败时 README 不会变）
          git diff --cached --quiet || git commit -m "🌸 今日看板娘已更新"
          git push
